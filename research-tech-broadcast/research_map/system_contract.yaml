协议版本: "1.0"
项目名称: "网约车用户侧仿真与出价模型"
生效月份: "2026-04"
最近更新: "2026-09-06"
用途: "为论文模块提供稳定的工程接入位置；不用于论文范式分类或筛选。"

业务边界:
  决策对象: "平台面向乘客的价格、报价、券、折扣与激励"
  用户反馈:
    - "询价"
    - "请求或放弃"
    - "接受或拒绝"
    - "取消"
    - "完单"
    - "复购与延迟结果"
  可作为上下文:
    - "聚合供需强弱"
    - "预计等待"
    - "服务可用性"
  明确排除:
    - "单车或司机 agent"
    - "匹配与调度"
    - "车辆再平衡与车队规模"
    - "道路网络交通仿真"
    - "商家广告竞价与拍卖支付"

当前基线:
  主要策略范式: "DT"
  说明: "DT 是当前模型构建的主要 baseline，不是论文检索、归类或模块拆解的锚点。"
  具体代码接口: "待项目确认"
  当前仿真 baseline: "待项目确认"

全局接口约束:
  决策粒度: "以用户会话或请求为主；预算控制可按日、周或活动周期"
  动作语义: "必须是平台给用户的价格、报价、券、折扣或激励"
  时间要求: "日志必须区分动作时刻、反馈到达时刻和最终结果揭晓时刻"
  评估要求: "离线评估必须记录行为策略或可重建的动作概率；缺失时显式标记支持度风险"
  未确认事实: "数据字段、向量维度、服务延迟和线上更新频率均不得从论文反推"

系统模块:
  - 模块编号: "user_request_generation"
    中文名称: "用户与请求生成"
    作用: "生成用户、会话、请求及当前环境上下文"
    主要输入:
      - "历史用户、会话与请求日志"
      - "时间与区域上下文"
      - "聚合供需、预计等待和服务可用性"
    主要输出:
      - "用户与会话样本"
      - "请求到达与请求上下文"
    决策粒度: "用户、会话或请求"
    当前实现: "待项目确认"

  - 模块编号: "user_state"
    中文名称: "用户状态构造"
    作用: "把历史行为和当前请求压成策略及响应模型可消费的状态"
    主要输入:
      - "询价、报价、接受、拒绝、取消、完单与复购历史"
      - "当前请求、价格、预计等待和聚合供需"
    主要输出:
      - "固定维向量、token 序列或结构化状态"
    更新时点: "离线初始化与在线行为到达时；具体频率待项目确认"
    当前实现: "DT 输入构造方式待项目确认"

  - 模块编号: "user_pricing_policy"
    中文名称: "用户侧出价策略"
    作用: "根据用户状态和业务约束生成用户侧动作"
    主要输入:
      - "用户状态"
      - "可行动作集合"
      - "预算及安全约束"
    主要输出:
      - "价格、报价、券、折扣或激励动作"
    决策粒度: "请求级或用户级"
    当前实现: "DT 为主要 baseline；动作编码和训练目标待项目确认"

  - 模块编号: "user_response_model"
    中文名称: "用户响应模型"
    作用: "给定用户状态和平台动作，生成或预测用户行为"
    主要输入:
      - "用户状态"
      - "价格或优惠动作"
      - "预计等待与服务可用性"
    主要输出:
      - "请求、接受、拒绝、取消、完单或复购的概率与样本"
    更新时点: "离线训练；是否在线校准待项目确认"
    当前实现: "待项目确认"

  - 模块编号: "delayed_outcome"
    中文名称: "延迟结果建模"
    作用: "在最终结果尚未揭晓时利用中间行为和样本年龄"
    主要输入:
      - "动作后的用户事件轨迹"
      - "事件时间间隔与样本年龄"
      - "已揭晓的完整生命周期样本"
    主要输出:
      - "结果后验、软标签或条件转移概率"
    当前实现: "待项目确认"

  - 模块编号: "budget_and_safety"
    中文名称: "预算与安全约束"
    作用: "控制优惠消耗、动作可行性、节奏和跨周期分配"
    主要输入:
      - "剩余预算与剩余流量"
      - "候选动作成本和预估增量收益"
      - "动作变化与业务安全边界"
    主要输出:
      - "可行动作、预算影子价格或下一周期额度"
    决策粒度: "请求级门控或周期级控制"
    当前实现: "待项目确认"

  - 模块编号: "offline_policy_evaluation"
    中文名称: "离线策略评估"
    作用: "在不上线执行新策略时估计策略价值、覆盖风险和不确定性"
    主要输入:
      - "历史用户状态、动作和结果"
      - "行为策略概率或可重建信息"
      - "候选策略动作概率"
    主要输出:
      - "策略价值、置信区间、支持度与有效样本诊断"
    当前实现: "待项目确认"

  - 模块编号: "closed_loop_simulation"
    中文名称: "闭环仿真编排"
    作用: "串联请求、状态、动作、响应、延迟结果、收益与下一步状态"
    主要输入:
      - "用户与请求生成器"
      - "出价策略"
      - "用户响应与延迟结果模型"
      - "预算和外部聚合上下文"
    主要输出:
      - "完整交互轨迹、收益、体验和约束指标"
    当前实现: "待项目确认"
