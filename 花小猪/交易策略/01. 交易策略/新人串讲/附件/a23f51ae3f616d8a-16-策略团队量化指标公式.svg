<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='675' viewBox='0 0 1200 675'><style>.title{font:700 34px Arial,'PingFang SC','Microsoft YaHei';fill:#111}.h{font:700 22px Arial,'PingFang SC','Microsoft YaHei';fill:#111}.t{font:19px Arial,'PingFang SC','Microsoft YaHei';fill:#333}.s{font:16px Arial,'PingFang SC','Microsoft YaHei';fill:#555}.num{font:700 38px Arial,'PingFang SC','Microsoft YaHei';fill:#f97316}.bl{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:18}.g{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:18}.o{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:18}.y{fill:#fefce8;stroke:#ca8a04;stroke-width:2;rx:18}.r{fill:#fef2f2;stroke:#ef4444;stroke-width:2;rx:18}.p{fill:#faf5ff;stroke:#9333ea;stroke-width:2;rx:18}.cell{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.a{stroke:#475569;stroke-width:3;marker-end:url(#a);fill:none}</style><defs><marker id='a' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'><path d='M0,0 L0,6 L9,3 z' fill='#475569'/></marker></defs>
<text class='title' x='405' y='55'>策略团队常用量化指标</text>
<rect class='bl' x='70' y='115' width='250' height='150'/><text class='h' x='155' y='155'>规模</text><text class='t' x='110' y='200'>GMV：完单应付总额</text><text class='t' x='110' y='235'>完单量 / 呼叫量</text>
<rect class='g' x='350' y='115' width='250' height='150'/><text class='h' x='435' y='155'>转化</text><text class='t' x='390' y='200'>AR = 应答 / 呼叫</text><text class='t' x='390' y='235'>CR = 完单 / 呼叫</text>
<rect class='o' x='630' y='115' width='250' height='150'/><text class='h' x='715' y='155'>效率</text><text class='t' x='670' y='200'>TPH = 完单 / TSH</text><text class='t' x='670' y='235'>PK胜率 = 应答 / 举手</text>
<rect class='r' x='910' y='115' width='250' height='150'/><text class='h' x='995' y='155'>体验</text><text class='t' x='950' y='200'>履约率 = 完单 / 应答</text><text class='t' x='950' y='235'>取消率 / 接驾距离</text>
<rect class='y' x='205' y='365' width='350' height='160'/><text class='h' x='330' y='405'>收益</text><text class='t' x='245' y='450'>抽成 = GMV - 司机应收</text><text class='t' x='245' y='485'>TR = 抽成 / GMV</text>
<rect class='p' x='645' y='365' width='350' height='160'/><text class='h' x='790' y='405'>投入产出</text><text class='t' x='685' y='450'>ROI = 增量GMV / 增量Cost</text><text class='t' x='685' y='485'>用于衡量补贴或策略是否划算</text>
</svg>