<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <style>
    .title{font:700 32px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#222}
    .box{fill:#fff;stroke:#333;stroke-width:2;rx:18}
    .core{fill:#fff6e5;stroke:#f59e0b;stroke-width:3;rx:22}
    .blue{fill:#eef6ff;stroke:#3b82f6;stroke-width:2;rx:18}
    .green{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:18}
    .gray{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:18}
    .txt{font:22px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111}
    .small{font:18px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#444}
    .arrow{stroke:#555;stroke-width:2.5;marker-end:url(#arrow);fill:none}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
  <text class="title" x="370" y="48">花小猪聚合业务生态</text>
  <rect class="blue" x="60" y="120" width="200" height="110"/>
  <text class="txt" x="115" y="165">乘客</text><text class="small" x="85" y="198">价格敏感 / 下沉场景</text>
  <rect class="core" x="410" y="105" width="280" height="140"/>
  <text class="txt" x="480" y="157">花小猪平台</text><text class="small" x="455" y="192">流量承接、交易撮合</text><text class="small" x="455" y="220">体验与生态治理</text>
  <rect class="green" x="840" y="90" width="200" height="100"/>
  <text class="txt" x="895" y="133">商家</text><text class="small" x="875" y="165">自营 / 三方 / CP</text>
  <rect class="green" x="840" y="250" width="200" height="100"/>
  <text class="txt" x="895" y="293">司机</text><text class="small" x="875" y="325">自营司机 / 商家司机</text>
  <rect class="gray" x="410" y="390" width="280" height="130"/>
  <text class="txt" x="465" y="438">策略算法</text><text class="small" x="442" y="474">定价、召回、分单、PK</text><text class="small" x="470" y="502">补贴、调度、风控</text>
  <path class="arrow" d="M260 175 H405"/><text class="small" x="295" y="158">发单需求</text>
  <path class="arrow" d="M690 155 H835"/><text class="small" x="720" y="138">订单分发/PK</text>
  <path class="arrow" d="M940 190 V245"/><text class="small" x="955" y="225">供给组织</text>
  <path class="arrow" d="M840 315 C690 355 650 390 620 390"/><text class="small" x="690" y="345">司机应答/履约</text>
  <path class="arrow" d="M520 390 V250"/><text class="small" x="540" y="325">策略决策</text>
  <path class="arrow" d="M410 455 C245 455 165 350 160 235"/><text class="small" x="210" y="420">成交体验反馈</text>
</svg>
