<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='675' viewBox='0 0 1200 675'><style>.title{font:700 34px Arial,'PingFang SC','Microsoft YaHei';fill:#111}.h{font:700 23px Arial,'PingFang SC','Microsoft YaHei';fill:#111}.t{font:19px Arial,'PingFang SC','Microsoft YaHei';fill:#333}.s{font:16px Arial,'PingFang SC','Microsoft YaHei';fill:#555}.num{font:700 42px Arial,'PingFang SC','Microsoft YaHei';fill:#f97316}.b{fill:#fff;stroke:#334155;stroke-width:2;rx:18}.o{fill:#fff7ed;stroke:#f97316;stroke-width:3;rx:20}.bl{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:18}.g{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:18}.r{fill:#fef2f2;stroke:#ef4444;stroke-width:2;rx:18}.y{fill:#fefce8;stroke:#ca8a04;stroke-width:2;rx:18}.p{fill:#faf5ff;stroke:#9333ea;stroke-width:2;rx:18}.a{stroke:#475569;stroke-width:3;marker-end:url(#a);fill:none}.line{stroke:#cbd5e1;stroke-width:2}.cell{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}</style><defs><marker id='a' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'><path d='M0,0 L0,6 L9,3 z' fill='#475569'/></marker></defs>
<text class='title' x='395' y='55'>聚合模式：资金流与能力流</text>
<g transform='translate(70,135)'>
<rect class='bl' x='0' y='0' width='150' height='85'/><text class='h' x='50' y='38'>乘客</text><text class='s' x='35' y='65'>支付车费</text>
<rect class='o' x='205' y='0' width='150' height='85'/><text class='h' x='245' y='38'>聚合平台</text><text class='s' x='225' y='65'>技术/规则</text>
<rect class='g' x='410' y='0' width='150' height='85'/><text class='h' x='462' y='38'>商家</text><text class='s' x='440' y='65'>运营/抽成</text>
<rect class='y' x='615' y='0' width='150' height='85'/><text class='h' x='670' y='38'>CP</text><text class='s' x='640' y='65'>车辆/司机</text>
<rect class='p' x='820' y='0' width='150' height='85'/><text class='h' x='850' y='38'>流量渠道</text><text class='s' x='850' y='65'>流量费用</text>
<rect class='r' x='1025' y='0' width='150' height='85'/><text class='h' x='1075' y='38'>司机</text><text class='s' x='1060' y='65'>获得收入</text>
<path class='a' d='M150 42 H200'/><path class='a' d='M355 42 H405'/><path class='a' d='M560 42 H610'/><path class='a' d='M765 42 H815'/><path class='a' d='M970 42 H1020'/>
<text class='s' x='410' y='125'>资金流：乘客 → 聚合平台 → 商家 → CP / 渠道 → 司机</text>
</g>
<rect class='cell' x='130' y='365' width='235' height='80'/><text class='h' x='180' y='413'>平台能力</text><text class='s' x='155' y='438'>调价 / 补贴 / 分单 / PK</text>
<rect class='cell' x='365' y='365' width='235' height='80'/><text class='h' x='420' y='413'>商家价值</text><text class='s' x='395' y='438'>运营 / 资金 / 牌照 / 税收</text>
<rect class='cell' x='600' y='365' width='235' height='80'/><text class='h' x='650' y='413'>流量价值</text><text class='s' x='630' y='438'>端内 / PBD / 特惠联盟</text>
<rect class='cell' x='835' y='365' width='235' height='80'/><text class='h' x='885' y='413'>供给价值</text><text class='s' x='865' y='438'>司机管理 / 合规车辆</text>
<text class='t' x='245' y='575'>聚合的本质：平台让渡一部分利益，换取商家的额外能力，提升供给侧和交易链路整体效率。</text>
</svg>