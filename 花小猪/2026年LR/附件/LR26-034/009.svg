<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .outer { fill: #fffdf7; stroke: #f6d77a; stroke-width: 2; rx: 10; }
      .inputArea { fill: #fbfff8; stroke: #22c55e; stroke-width: 1.2; stroke-dasharray: 4 4; rx: 4; }
      .modelArea { fill: #fbfdff; stroke: #3b82f6; stroke-width: 1.2; stroke-dasharray: 4 4; rx: 4; }
      .outputArea { fill: #fffafa; stroke: #ef4444; stroke-width: 1.2; stroke-dasharray: 4 4; rx: 4; }
      .labelGreen { font: 700 16px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #16a34a; }
      .labelBlue { font: 700 16px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #2563eb; }
      .labelRed { font: 700 16px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #dc2626; }
      .h { font: 700 17px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .t { font: 500 14px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #374151; }
      .s { font: 400 12px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; }
      .math { font: 700 18px "Times New Roman", "STIX Two Text", serif; fill: #111827; }
      .mathSmall { font: 700 15px "Times New Roman", "STIX Two Text", serif; fill: #111827; }
      .modelNode { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; rx: 12; }
      .calc { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.1; rx: 4; }
      .score { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.2; rx: 5; }
      .guard { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.2; rx: 5; }
      .out { fill: #ffffff; stroke: #fca5a5; stroke-width: 1.1; rx: 4; }
      .line { stroke: #64748b; stroke-width: 1.1; fill: none; marker-end: url(#arrow); }
      .lineSoft { stroke: #94a3b8; stroke-width: 0.95; fill: none; marker-end: url(#arrow); }
      .bracket { stroke: #94a3b8; stroke-width: 1; fill: none; }
    </style>
  </defs>

  <rect class="bg" width="1240" height="520"/>
  <rect class="outer" x="16" y="16" width="1208" height="478"/>

  <rect class="inputArea" x="46" y="54" width="150" height="350"/>
  <text class="labelGreen" x="81" y="82">模型输入</text>

  <rect class="modelArea" x="204" y="54" width="820" height="350"/>
  <text class="labelBlue" x="596" y="82">模型</text>

  <rect class="outputArea" x="1032" y="54" width="150" height="350"/>
  <text class="labelRed" x="1076" y="82">模型输出</text>

  <text class="t" x="62" y="122">司机特征 i</text>
  <rect x="160" y="109" width="16" height="16" fill="#dbeafe" stroke="#93c5fd"/>
  <text class="t" x="62" y="155">目标格子 j</text>
  <rect x="160" y="142" width="16" height="16" fill="#dcfce7" stroke="#86efac"/>
  <text class="t" x="62" y="188">ETA / 供需</text>
  <rect x="160" y="175" width="16" height="16" fill="#fef3c7" stroke="#fcd34d"/>
  <text class="t" x="62" y="221">历史 / 天气</text>
  <rect x="160" y="208" width="16" height="16" fill="#fee2e2" stroke="#fca5a5"/>
  <line class="bracket" x1="54" y1="96" x2="54" y2="233"/>
  <line class="bracket" x1="54" y1="96" x2="59" y2="96"/>
  <line class="bracket" x1="54" y1="233" x2="59" y2="233"/>
  <text class="s" x="80" y="265">样本：司机-格子对</text>
  <text class="mathSmall" x="86" y="294">X_ij</text>
  <text class="s" x="62" y="334">干预标记 T_dispatch</text>

  <line class="line" x1="196" y1="224" x2="240" y2="224"/>

  <rect class="modelNode" x="240" y="148" width="152" height="152"/>
  <text class="h" x="274" y="183">DRCFR</text>
  <text class="t" x="266" y="211">主分支</text>
  <text class="t" x="256" y="237">差听单分支</text>
  <text class="s" x="262" y="267">Embedding + β/δ/γ</text>

  <rect class="calc" x="430" y="100" width="122" height="58"/>
  <text class="mathSmall" x="461" y="124">F_0, F_1</text>
  <text class="s" x="456" y="145">完单概率</text>

  <rect class="calc" x="430" y="272" width="122" height="58"/>
  <text class="mathSmall" x="449" y="296">P_0, P_1</text>
  <text class="s" x="448" y="317">差听单概率</text>

  <rect class="calc" x="430" y="340" width="122" height="48"/>
  <text class="mathSmall" x="449" y="362">A_0, A_1</text>
  <text class="s" x="438" y="380">差听单发生后秒数</text>

  <line class="lineSoft" x1="392" y1="184" x2="430" y2="129"/>
  <line class="lineSoft" x1="392" y1="246" x2="430" y2="301"/>
  <line class="lineSoft" x1="392" y1="260" x2="430" y2="364"/>

  <rect class="guard" x="622" y="111" width="150" height="64"/>
  <text class="t" x="654" y="136">完单约束</text>
  <text class="mathSmall" x="645" y="160">F_1 - F_0 ≥ 0</text>
  <line class="lineSoft" x1="552" y1="129" x2="622" y2="143"/>

  <rect class="score" x="622" y="286" width="150" height="76"/>
  <text class="t" x="648" y="311">预期差听单秒数</text>
  <text class="mathSmall" x="643" y="337">B_t = P_t × A_t</text>
  <line class="lineSoft" x1="552" y1="301" x2="622" y2="316"/>
  <line class="lineSoft" x1="552" y1="364" x2="622" y2="346"/>

  <rect class="score" x="812" y="286" width="102" height="76"/>
  <text class="mathSmall" x="833" y="314">score</text>
  <text class="mathSmall" x="830" y="341">B_0-B_1</text>
  <line class="line" x1="772" y1="324" x2="812" y2="324"/>

  <rect class="calc" x="846" y="204" width="130" height="64"/>
  <text class="t" x="871" y="230">决策规则</text>
  <text class="mathSmall" x="864" y="254">score ≥ λ</text>
  <path class="lineSoft" d="M772,143 C812,154 832,184 846,218"/>
  <path class="lineSoft" d="M863,286 C875,276 892,271 911,268"/>

  <line class="line" x1="976" y1="236" x2="1052" y2="236"/>
  <line class="line" x1="914" y1="324" x2="1052" y2="338"/>

  <rect class="out" x="1052" y="204" width="104" height="64"/>
  <text class="t" x="1078" y="230">是否调度</text>
  <text class="math" x="1084" y="255">{0,1}</text>

  <rect class="out" x="1052" y="306" width="104" height="64"/>
  <text class="t" x="1071" y="331">排序分</text>
  <text class="s" x="1064" y="356">Δ差听单秒数</text>

  <text class="s" x="265" y="424">备注：P_t=P(发生差听单 | X,T=t)，A_t=E(差听单持续秒数 | 已发生差听单, X,T=t)。</text>
  <text class="s" x="300" y="447">B_t=P_t×A_t=E(差听单秒数 | X,T=t)，表示策略 t 下的预期差听单秒数。</text>
  <text class="s" x="360" y="470">score 越大，表示预计调度后减少的差听单秒数越多；完单不负是约束条件，不作为主优化目标。</text>
</svg>
