<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2380" viewBox="0 0 1500 2380">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .container { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2.5; rx: 16; }
      .cross { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 12; }
      .deep { fill: #f0fdf4; stroke: #4ade80; stroke-width: 2; rx: 12; }
      .head { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 12; }
      .out { fill: #fefce8; stroke: #eab308; stroke-width: 2; rx: 12; }
      .note { fill: #f8fafc; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; rx: 12; }
      .decision { fill: #faf5ff; stroke: #a855f7; stroke-width: 2; rx: 12; }
      .title { font: 600 26px "Arial", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .sub { font: 500 22px "Arial", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .text { font: 400 20px "Arial", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .small { font: 400 17px "Arial", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .tiny { font: 400 15px "Arial", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow-soft); }
    </style>
  </defs>

  <rect class="bg" width="1500" height="2380"/>
  <text class="title" x="750" y="48" text-anchor="middle">订单 Hold V1 - 模型一完整框架</text>

  <rect class="box" x="335" y="80" width="830" height="128"/>
  <text class="sub" x="750" y="118" text-anchor="middle">输入层：约 532 维特征 → 统一预处理 → 入模向量 x</text>
  <text class="small" x="750" y="150" text-anchor="middle">订单基础特征 / 乘客画像 / 时空供需特征</text>
  <text class="tiny" x="750" y="178" text-anchor="middle">预处理包含筛列、缺失/异常处理、标准化；这里合并展示，不作为模型主体展开</text>

  <path class="edge" d="M750 208 L750 255"/>

  <rect class="container" x="60" y="255" width="1380" height="1015"/>
  <text class="title" x="750" y="302" text-anchor="middle">DCNv2 Backbone：主体特征提取模块</text>
  <text class="small" x="750" y="334" text-anchor="middle">只有一个入模向量 x 进入 Backbone；Backbone 内部再把同一个 x 送入两个并行分支</text>

  <rect class="box" x="540" y="365" width="420" height="58"/>
  <text class="text" x="750" y="401" text-anchor="middle">Backbone 内部分叉：同一个 x</text>
  <path class="edge" d="M750 423 L500 470"/>
  <path class="edge" d="M750 423 L1130 470"/>

  <rect class="cross" x="100" y="460" width="800" height="640"/>
  <text class="sub" x="500" y="498" text-anchor="middle">CrossNetV2 分支：显式特征交叉</text>

  <rect class="box" x="135" y="545" width="230" height="74"/>
  <text class="text" x="250" y="576" text-anchor="middle">固定原始输入</text>
  <text class="small" x="250" y="601" text-anchor="middle">x0 = x</text>

  <rect class="box" x="465" y="545" width="370" height="74"/>
  <text class="text" x="650" y="576" text-anchor="middle">当前层表示</text>
  <text class="small" x="650" y="601" text-anchor="middle">第 1 层输入也是 x</text>

  <path class="edge" d="M650 619 L650 660"/>
  <rect class="cross" x="405" y="660" width="490" height="82"/>
  <text class="small" x="650" y="691" text-anchor="middle">Cross Layer 1：低秩变换 + 乘性交叉 + 残差</text>
  <text class="tiny" x="650" y="718" text-anchor="middle">x1 = x0 ⊙ U1(V1ᵀx) + b1 + x</text>

  <path class="edge" d="M650 742 L650 790"/>
  <rect class="cross" x="405" y="790" width="490" height="82"/>
  <text class="small" x="650" y="821" text-anchor="middle">Cross Layer 2：继续复用原始 x0 做交叉</text>
  <text class="tiny" x="650" y="848" text-anchor="middle">x2 = x0 ⊙ U2(V2ᵀx1) + b2 + x1</text>

  <path class="edge" d="M650 872 L650 920"/>
  <rect class="cross" x="405" y="920" width="490" height="82"/>
  <text class="small" x="650" y="951" text-anchor="middle">Cross Layer 3：输出显式交叉表达</text>
  <text class="tiny" x="650" y="978" text-anchor="middle">x3 = x0 ⊙ U3(V3ᵀx2) + b3 + x2</text>

  <path class="dash" d="M365 582 C385 582 385 701 405 701"/>
  <path class="dash" d="M365 582 C385 582 385 831 405 831"/>
  <path class="dash" d="M365 582 C385 582 385 961 405 961"/>
  <text class="tiny" x="300" y="720" text-anchor="middle">每层都复用</text>
  <text class="tiny" x="300" y="742" text-anchor="middle">原始 x0</text>

  <path class="edge" d="M650 1002 L650 1035"/>
  <rect class="box" x="450" y="1035" width="400" height="54"/>
  <text class="small" x="650" y="1069" text-anchor="middle">cross_out = x3，维度 = input_dim</text>

  <rect class="deep" x="955" y="460" width="430" height="640"/>
  <text class="sub" x="1170" y="498" text-anchor="middle">DeepNetwork 分支</text>
  <text class="small" x="1170" y="526" text-anchor="middle">深层非线性表达</text>

  <rect class="box" x="1025" y="562" width="290" height="48"/>
  <text class="small" x="1170" y="593" text-anchor="middle">输入 x</text>
  <path class="edge" d="M1170 610 L1170 660"/>

  <rect class="deep" x="985" y="660" width="370" height="50"/>
  <text class="small" x="1170" y="692" text-anchor="middle">Linear 1024 + BN + ReLU + Dropout</text>
  <path class="edge" d="M1170 710 L1170 748"/>

  <rect class="deep" x="985" y="748" width="370" height="50"/>
  <text class="small" x="1170" y="780" text-anchor="middle">Linear 512 + BN + ReLU + Dropout</text>
  <path class="edge" d="M1170 798 L1170 836"/>

  <rect class="deep" x="985" y="836" width="370" height="50"/>
  <text class="small" x="1170" y="868" text-anchor="middle">Linear 256 + BN + ReLU + Dropout</text>
  <path class="edge" d="M1170 886 L1170 924"/>

  <rect class="deep" x="985" y="924" width="370" height="50"/>
  <text class="small" x="1170" y="956" text-anchor="middle">Linear 128 + BN + ReLU + Dropout</text>
  <path class="edge" d="M1170 974 L1170 1012"/>

  <rect class="deep" x="985" y="1012" width="370" height="50"/>
  <text class="small" x="1170" y="1044" text-anchor="middle">Linear 64 + BN + ReLU + Dropout</text>
  <path class="edge" d="M1170 1062 L1170 1090"/>

  <rect class="box" x="990" y="1090" width="360" height="54"/>
  <text class="small" x="1170" y="1124" text-anchor="middle">deep_out，维度 = 64</text>

  <path class="edge" d="M650 1089 C650 1130 705 1170 750 1170"/>
  <path class="edge" d="M1170 1144 C1170 1178 955 1170 860 1170"/>

  <rect class="box" x="600" y="1148" width="300" height="66"/>
  <text class="text" x="750" y="1174" text-anchor="middle">Concat 拼接</text>
  <text class="small" x="750" y="1199" text-anchor="middle">cross_out + deep_out</text>

  <path class="edge" d="M750 1214 L750 1245"/>
  <rect class="box" x="520" y="1245" width="460" height="58"/>
  <text class="small" x="750" y="1281" text-anchor="middle">Backbone 输出，维度 = input_dim + 64</text>

  <path class="edge" d="M750 1303 L750 1350"/>
  <rect class="head" x="430" y="1350" width="640" height="86"/>
  <text class="sub" x="750" y="1384" text-anchor="middle">Hazard Head：Linear(input_dim + 64, 20)</text>
  <text class="small" x="750" y="1414" text-anchor="middle">20 = T_MAX，对应第 1~20 秒的风险输出</text>

  <path class="edge" d="M750 1436 L750 1475"/>
  <rect class="head" x="570" y="1475" width="360" height="70"/>
  <text class="text" x="750" y="1504" text-anchor="middle">Sigmoid</text>
  <text class="tiny" x="750" y="1527" text-anchor="middle">把 20 个 logits 映射到 (0,1) 概率</text>

  <path class="edge" d="M750 1545 L750 1588"/>
  <rect class="out" x="520" y="1588" width="460" height="70"/>
  <text class="text" x="750" y="1618" text-anchor="middle">20 个时间步概率 p1~p20</text>
  <text class="tiny" x="750" y="1641" text-anchor="middle">条件语义不是 Sigmoid 自动产生的</text>

  <rect class="note" x="45" y="1492" width="405" height="172"/>
  <text class="text" x="247" y="1530" text-anchor="middle">为什么能学到条件概率？</text>
  <text class="tiny" x="247" y="1558" text-anchor="middle">1. 每个输出 p_t 只回答“第 t 秒这一题”</text>
  <text class="tiny" x="247" y="1582" text-anchor="middle">2. 只用“已经等到第 t 秒”的订单训练 p_t</text>
  <text class="tiny" x="247" y="1606" text-anchor="middle">3. 后续不可观察秒数不参与训练</text>
  <text class="tiny" x="247" y="1630" text-anchor="middle">所以 p_t 学到的是：</text>
  <text class="tiny" x="247" y="1654" text-anchor="middle">已等到第 t 秒时，这一秒取消概率</text>
  <path class="dash" d="M450 1608 C480 1608 492 1622 520 1622"/>

  <path class="edge" d="M750 1658 L750 1695"/>
  <rect class="head" x="435" y="1695" width="630" height="128"/>
  <text class="text" x="750" y="1728" text-anchor="middle">按秒生存分析 Loss</text>
  <text class="tiny" x="750" y="1756" text-anchor="middle">取消样本：取消前 -log(1-p_t)，取消秒 -log(p_t)</text>
  <text class="tiny" x="750" y="1782" text-anchor="middle">被应答/超窗样本：只对观察到的秒数计算 -log(1-p_t)</text>
  <text class="tiny" x="750" y="1808" text-anchor="middle">没观察到的后续秒数不参与训练</text>

  <rect class="note" x="45" y="1676" width="355" height="198"/>
  <text class="text" x="222" y="1708" text-anchor="middle">样本如何参与 Loss？</text>
  <text class="tiny" x="222" y="1738" text-anchor="middle">例1：第 6 秒取消</text>
  <text class="tiny" x="222" y="1762" text-anchor="middle">p1~p5 学“没取消”</text>
  <text class="tiny" x="222" y="1786" text-anchor="middle">p6 学“取消”，p7~p20 不看</text>
  <text class="tiny" x="222" y="1824" text-anchor="middle">例2：第 5 秒被应答</text>
  <text class="tiny" x="222" y="1848" text-anchor="middle">p1~p5 学“没取消”</text>
  <text class="tiny" x="222" y="1872" text-anchor="middle">p6~p20 不看</text>
  <path class="dash" d="M400 1764 C415 1764 420 1764 435 1764"/>

  <path class="edge" d="M750 1823 L750 1875"/>
  <rect class="out" x="425" y="1875" width="650" height="104"/>
  <text class="sub" x="750" y="1908" text-anchor="middle">逐秒条件取消风险 h1~h20</text>
  <text class="tiny" x="750" y="1934" text-anchor="middle">第 t 个输出只在“已经等到第 t 秒”的订单上训练</text>
  <text class="tiny" x="750" y="1960" text-anchor="middle">所以 h(t)=P(第 t 秒取消 | 前 t-1 秒未取消)</text>

  <path class="edge" d="M1075 1927 C1115 1927 1125 1927 1160 1927"/>
  <rect class="box" x="1160" y="1886" width="280" height="82"/>
  <text class="text" x="1300" y="1918" text-anchor="middle">导出 h1~h20</text>
  <text class="small" x="1300" y="1946" text-anchor="middle">评估 / 解释使用</text>

  <path class="edge" d="M750 1979 L750 2028"/>
  <rect class="box" x="555" y="2028" width="390" height="88"/>
  <text class="text" x="750" y="2061" text-anchor="middle">生存分析转换</text>
  <text class="tiny" x="750" y="2088" text-anchor="middle">S(t)=∏(1-h(k))，cancel_t = 1 - S(t)</text>

  <path class="edge" d="M750 2116 L750 2160"/>
  <rect class="out" x="520" y="2160" width="460" height="82"/>
  <text class="text" x="750" y="2192" text-anchor="middle">导出 cancel_1~cancel_20</text>
  <text class="small" x="750" y="2221" text-anchor="middle">线上策略主要使用</text>

  <path class="edge" d="M750 2242 L750 2285"/>
  <rect class="decision" x="445" y="2285" width="610" height="76"/>
  <text class="text" x="750" y="2315" text-anchor="middle">与模型二 eda_t 结合，通过 lambda 做风险收益权衡</text>
  <text class="small" x="750" y="2342" text-anchor="middle">决策最终 hold 秒数和 EDA 阈值</text>
</svg>
